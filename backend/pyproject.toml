[project]
name = "bloodbridge-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008", "S101", "S105", "S106", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"app/seed/*" = ["S311"]
